<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26407A"/><stop offset="1" stop-color="#101C3F"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF2F8"/></linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2B441"/><stop offset=".5" stop-color="#FFD27A"/><stop offset="1" stop-color="#D9932A"/></linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9AA6B8"/><stop offset=".5" stop-color="#E9EEF5"/><stop offset="1" stop-color="#7E8AA0"/></linearGradient>
    <filter id="iconsh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#050B1F" flood-opacity=".45"/></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A9BBDA" stroke-width="1.6" opacity=".55"/></pattern>
    <clipPath id="page"><rect x="0" y="0" width="520" height="640" rx="26"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconsh)"/>
  <clipPath id="sqB"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath><circle cx="260" cy="210" r="320" fill="#5A86E6" opacity=".16" clip-path="url(#sqB)"/>
  <!-- Notizblatt, leicht gedreht -->
  <g transform="translate(232 214) rotate(-6 260 320)" filter="url(#sh)">
    <rect x="12" y="12" width="520" height="640" rx="26" fill="#C9D3E6"/>
    <rect width="520" height="640" rx="26" fill="url(#paper)"/>
    <g clip-path="url(#page)"><rect width="520" height="640" fill="url(#grid)"/>
      <rect y="0" width="520" height="70" fill="#3B6FD8"/>
      <g fill="#fff" opacity=".9"><circle cx="70" cy="35" r="10"/><circle cx="130" cy="35" r="10"/><circle cx="190" cy="35" r="10"/><circle cx="250" cy="35" r="10"/><circle cx="310" cy="35" r="10"/><circle cx="370" cy="35" r="10"/><circle cx="430" cy="35" r="10"/></g>
    </g>
    <!-- Reaktionsschema in Tinte -->
    <g fill="none" stroke="#1F4FB8" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
      <path d="M118 238 l52 -30 l52 30 v60 l-52 30 l-52 -30 z"/>
      <path d="M134 250 l36 -21 M206 250 v36 M134 286 l36 21" stroke-width="8"/>
      <path d="M170 208 v-46"/>
      <path d="M262 268 h96 m-26 -20 l26 20 l-26 20"/>
      <path d="M396 238 l52 -30 l52 30" opacity="0"/>
    </g>
    <g fill="none" stroke="#1F4FB8" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" transform="translate(268 0)">
      <path d="M118 238 l52 -30 l52 30 v60 l-52 30 l-52 -30 z"/>
      <path d="M134 250 l36 -21 M206 250 v36 M134 286 l36 21" stroke-width="8"/>
      <path d="M170 208 v-46 M170 162 l38 -22"/>
    </g>
    <text x="155" y="148" font-family="Helvetica Neue, Arial" font-weight="700" font-size="34" fill="#1F4FB8">Br</text>
    <!-- Zeilen mit Mengen -->
    <g stroke="#7F98C8" stroke-width="12" stroke-linecap="round">
      <path d="M70 420 h150 M250 420 h80 M360 420 h90"/>
      <path d="M70 476 h120 M250 476 h80 M360 476 h70"/>
      <path d="M70 532 h170 M270 532 h60 M360 532 h90"/>
    </g>
  </g>
  <!-- Füller, unten rechts, zeigt auf die letzte Zeile -->
  <g transform="translate(742 760) rotate(-35) scale(.78)" filter="url(#sh)">
    <rect x="-34" y="-330" width="68" height="300" rx="30" fill="url(#pen)"/>
    <rect x="-36" y="-110" width="72" height="22" rx="6" fill="#B87A1F" opacity=".7"/>
    <path d="M-30 -32 h60 l-14 78 l-16 44 l-16 -44 z" fill="url(#nib)"/>
    <path d="M0 4 v80" stroke="#55627A" stroke-width="4"/>
    <circle cx="0" cy="14" r="6" fill="#55627A"/>
    <rect x="-8" y="-310" width="10" height="190" rx="5" fill="#fff" opacity=".45"/>
  </g>
</svg>
